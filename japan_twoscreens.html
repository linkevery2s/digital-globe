<!DOCTYPE HTML>
<html lang="ja">

<head prefix="og: http://ogp.me/ns# fb: http://ogp.me/ns/fb# article: http://ogp.me/ns/article#">
    <meta charset='UTF-8' name='viewport'
        content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-hash/0.2.1/leaflet-hash.min.js"
        integrity="sha512-0A4MbfuZq5Au9EdpI1S5rUTXlibNBi8CuZ/X3ycwXyZiCjNzpiO9YH6EMqPgzZm6vfNCuZStBQHjnO17nIC0IQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"
        integrity="sha512-GWzVrcGlo0TxTRvz9ttioyYJ+Wwk9Ck0G81D+eO63BaqHaJ3YZX9wuqjwgfcV/MrB2PhaVX9DkYVhbFpStnqpQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script src="./js/L.Map.Sync.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map_left {
            float: left;
            width: 49.8%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map_right {
            float: right;
            width: 49.8%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .japan_side_menu {
            position: absolute;
            top: 50%;
            transform: translate(10px, -50%);
            z-index: 10000;
        }

        .usage_guide,
        .japan_terrain,
        .japan_text,
        .japan_city {
            cursor: pointer;
            color: #000000;
            background: rgba(255, 255, 255, .8);
            border: 1px solid #000000;
            padding: .5em;
            border-radius: .5em;
        }

        .japan_two_screen {
            cursor: pointer;
            color: #000000;
            background: rgba(20, 186, 226, .8);
            border: 1px solid #000000;
            padding: .5em;
            border-radius: .5em;
        }

        #usage-guide {
            left: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            max-width: 600px;
            display: none;
            z-index: 10000;
            background: #ffffff;
            padding: .3em;
        }

        #usage-guide li {
            height: 40px;
            line-height: 40px;
            cursor: pointer;
            list-style: none;
        }

        #closed-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            border-radius: .3em;
            color: #ffffff;
            background: #2ca9e1;
            cursor: pointer;
            text-align: center;
        }

        #closed-btn:hover {
            background: #ffffff;
            color: rgba(25, 68, 142, 0.8);
            border: 1px solid rgba(25, 68, 142, 0.8);
        }

        .leaflet-control-layers {
            right: 0px;
            top: 55px !important;
        }

        .leaflet-control-attribution {
            margin-bottom: 60px !important;
            font-size: 9px;
        }

    </style>
    <script>

        /* 地図初期設定 */
        let para = location.hash;
        let par = para.split("/");
        let ini_zoom;

        ini_zoom = par[0].split("#")[1];

        lat = par[1];
        lng = par[2];


        const tiri = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
            //attribution: '&copy; <a href="http://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'
        });

        const base1 = new L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
            //attribution: '&copy; <a href="http://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'
        });

        const base2 = new L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            //attribution: '&copy; <a href="http://osm.org/copyright" target="_blank">OpenStreetMap</a> contributors'
        });

        const base3 = new L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/relief/{z}/{x}/{y}.png', {
            //attribution: '&copy; <a href="http://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'
        });


        const baseMaps = { "標準地図": base1, "OpenStreetMap": base2, "色別標高図": base3 };

        function ini() {

            const map_left = L.map('map_left', {
                center: [lat, lng],
                zoom: ini_zoom,
                layers: tiri,
                zoomControl: false
            });

            const map_right = L.map('map_right', {
                layers: [base1],
                center: [lat, lng],
                zoom: ini_zoom,
                zoomControl: false
            });

            L.control.layers(baseMaps).addTo(map_right);

            map_left.attributionControl.setPosition('bottomleft');
            map_right.attributionControl.setPosition('bottomleft');

            /* 地図連動 */
            map_left.sync(map_right, { syncCursor: true });
            map_right.sync(map_left, { syncCursor: true });

            let hash = new L.Hash(map_left);

            const usage_guide = document.querySelector('.usage_guide');
            usage_guide.addEventListener('click', () => {
                $('#usage-guide').fadeIn();
            });

            const closed_btn = document.querySelector("#closed-btn");
            closed_btn.addEventListener('click', () => {
                $('#usage-guide').fadeOut();
            });

            const japan_terrain = document.querySelector('.japan_terrain');
            const japan_text = document.querySelector('.japan_text');
            const japan_city = document.querySelector('.japan_city');
            const japan_two_screen = document.querySelector('.japan_two_screen');

            let pitch = 50;
            let bearing = 0;
            let positon; let zoom;

            japan_terrain.addEventListener('click', () => {
                position = map_left.getCenter();
                zoom = map_left.getZoom();
                location.href = "./japan_terrain.html#!" + position.lat + "/" + position.lng + "/" + zoom + "/" + pitch + "/" + bearing;
            });

            japan_text.addEventListener('click', () => {
                position = map_left.getCenter();
                zoom = map_left.getZoom();
                location.href = "./japan_text.html#!" + position.lat + "/" + position.lng + "/" + zoom + "/" + pitch + "/" + bearing;
            });

            japan_city.addEventListener('click', () => {
                position = map_left.getCenter();
                zoom = map_left.getZoom();
                location.href = "./japan_city.html#!" + position.lat + "/" + position.lng + "/" + zoom + "/" + pitch + "/" + bearing;
            });

            japan_two_screen.addEventListener('click', () => {
                position = map_left.getCenter();
                zoom = map_left.getZoom();
                location.href = "./japan_twoscreens.html#" + zoom + "/" + position.lat + "/" + position.lng;
            });

        }
    </script>
    <title>日本の地形（２画面表示）</title>

</head>

<body onLoad='ini()'>

    <div id="map_left">


    </div>
    <div id="map_right"></div>

    <!-- 日本の地形メニュー -->
    <div class="japan_side_menu text-center">
        <div class="usage_guide mb-1 "><i class="fa-solid fa-xl fa-clipboard-list"></i></div>
        <div class="japan_terrain mb-1"><i class="fa-solid fa-lg fa-image"></i></div>
        <div class="japan_text mb-1"><i class="fa-solid fa-lg fa-font"></i></div>
        <div class="japan_city mb-1"><i class="fa-solid fa-lg fa-city"></i></div>
        <div class="japan_two_screen mb-1"><i class="fa-solid fa-lg fa-table-columns"></i></div>
    </div>

    <div id="usage-guide"><span id="closed-btn" class="py-2 px-3 text-xs">閉じる</span>
        <h3 class="text-2xl mb-3 pl-3"><i class="fa-solid fa-lg fa-clipboard-list"></i> モード一覧</h3>

        <div class="text-left h-72 my-5 mx-3">

            <li><i class="fa-solid fa-lg fa-image"></i>　３D表示モード</li>
            <li><i class="fa-solid fa-lg fa-font"></i>　テキスト表示モード</li>
            <li><i class="fa-solid fa-lg fa-city"></i>　市区町村表示モード</li>
            <li><i class="fa-solid fa-lg fa-table-columns"></i>　2画面表示モード</li>

        </div>

    </div>

</body>
